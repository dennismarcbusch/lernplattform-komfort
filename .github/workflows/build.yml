name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax prüfen
        run: |
          node --check extension/content/content.js
          node --check extension/popup/popup.js
          python3 -m json.tool extension/manifest.json > /dev/null

      - name: Mit web-ext prüfen (Firefox-Kompatibilität)
        run: npx --yes web-ext@8 lint --source-dir extension --self-hosted

      - name: Version aus Tag mit manifest.json abgleichen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          MANIFEST=$(python3 -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$MANIFEST" != "$TAG" ]; then
            echo "::error::Tag v$TAG passt nicht zur Version $MANIFEST in extension/manifest.json"
            exit 1
          fi

      - name: ZIP bauen
        id: zip
        run: echo "file=$(bash scripts/build.sh)" >> "$GITHUB_OUTPUT"

      - name: ZIP als Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: lernplattform-komfort
          path: ${{ steps.zip.outputs.file }}

      # Bei jedem Push auf main: Vorabversion "latest" mit aktuellem ZIP
      - name: Vorabversion "latest" aktualisieren
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes || true
          git tag -f latest
          git push -f origin latest
          gh release create latest "${{ steps.zip.outputs.file }}" \
            --prerelease \
            --title "Aktueller Stand (main)" \
            --notes "Automatisch gebaut aus dem letzten Commit auf main (${GITHUB_SHA::7}). Für feste Versionen siehe die Releases mit Versionsnummer."

      # Bei einem Versions-Tag wie v0.2.0: richtiges Release mit ZIP
      - name: Release für Versions-Tag erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.zip.outputs.file }}" \
            --title "Lernplattform Komfort $GITHUB_REF_NAME" \
            --generate-notes
