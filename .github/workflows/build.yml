name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Syntax prüfen
        run: |
          node --check extension/content/content.js
          node --check extension/popup/popup.js
          python3 -m json.tool extension/manifest.json > /dev/null

      - name: Mit web-ext prüfen (Firefox-Kompatibilität)
        run: npx --yes web-ext@8 lint --source-dir extension --self-hosted

      - name: ZIP bauen
        id: zip
        run: |
          echo "file=$(bash scripts/build.sh)" >> "$GITHUB_OUTPUT"
          echo "version=$(python3 -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')" >> "$GITHUB_OUTPUT"

      - name: ZIP als Build-Artefakt hochladen
        uses: actions/upload-artifact@v7
        with:
          name: lernplattform-komfort
          path: ${{ steps.zip.outputs.file }}

      # Bei jedem Push auf main: Vorabversion "latest" mit aktuellem ZIP
      - name: Vorabversion "latest" aktualisieren
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes || true
          git tag -f latest
          git push -f origin latest
          gh release create latest "${{ steps.zip.outputs.file }}" dist/lernplattform-komfort.zip \
            --prerelease \
            --title "Aktueller Stand (main)" \
            --notes "Automatisch gebaut aus dem letzten Commit auf main (${GITHUB_SHA::7}). Für feste Versionen siehe die Releases mit Versionsnummer."

      # Neue Versionsnummer in manifest.json: festes Release v<version> anlegen
      - name: Release für neue Version erstellen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.zip.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION gibt es schon, nichts zu tun."
          else
            gh release create "v$VERSION" "${{ steps.zip.outputs.file }}" dist/lernplattform-komfort.zip \
              --target "$GITHUB_SHA" \
              --title "Lernplattform Komfort v$VERSION" \
              --generate-notes
          fi
